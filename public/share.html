<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared file</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="share-body">
  <main class="share-wrap">
    <div class="share-mark">↗</div>
    <p class="eyebrow">PRIVATE FILE LINK</p>
    <h1 id="share-title">Checking your link…</h1>
    <p id="share-detail" class="share-detail">One moment while we check access.</p>
    <a id="download-button" class="button primary download-button" hidden>Download file</a>
    <p class="share-foot">This link may expire or be revoked by its owner.</p>
  </main>
  <script src="/share.js" defer></script>
</body>
</html>
